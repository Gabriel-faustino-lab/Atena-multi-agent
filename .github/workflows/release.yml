name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Atena v__VERSION__"
          releaseBody: |
            # Atena v0.2.1 — correção de navegação entre painéis

            Esta atualização de manutenção corrige a sobreposição visual do terminal e do orquestrador ao navegar entre as áreas do workspace.

            ## O que mudou

            - O conteúdo dos terminais agora fica completamente oculto ao abrir Agents, Sessions, Git ou Settings, sem interromper os processos que continuam em segundo plano.
            - A configuração do orquestrador é fechada automaticamente ao navegar para outro painel.
            - Cliques na barra lateral, atalhos de teclado e ações da paleta de comandos passam pelo mesmo fluxo de navegação.

            ## Qualidade

            - 44 testes automatizados aprovados.
            - Build de produção e verificação TypeScript aprovados.
            - Lint executado sem novos erros.

            Os instaladores assinados e o arquivo de atualização automática estão disponíveis abaixo.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
